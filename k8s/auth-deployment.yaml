apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth

  template:
    metadata:
      labels:
        app: auth

    spec:
      containers:
      - name: auth
        image: anpya/auth-service:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        envFrom:
        - secretRef:
            name: db-secret
